[package]
name = "zroutery-plugin-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Restricted, control/UI-only QuickJS-NG worker"

[dependencies]
zroutery-plugin-api = { path = "../zroutery-plugin-api" }
serde_json = { workspace = true }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"] }

[build-dependencies]
static_vcruntime = "3.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }

[[bin]]
name = "zroutery-plugin-worker"
path = "src/main.rs"
