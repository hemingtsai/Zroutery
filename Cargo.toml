[workspace]
members = ["crates/zroutery-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
axum = { version = "0.8.7", features = ["json"] }
bytes = "1.10.1"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
futures-util = "0.3.31"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
# Favour throughput over the last few hundred KB: this is a request proxy.
opt-level = 3
panic = "abort"
strip = true
