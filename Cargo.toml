[workspace]
members = ["crates/zroutery-core", "crates/zroutery-headless", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
# The minimum is the union of two floors established from the tree itself, not a
# policy number. The locked dependencies need 1.90: the desktop shell's Tauri
# 2.12.4 family (`tauri-build` 2.7.3, `tauri-utils` 2.10.2, `tauri-runtime`
# 2.12.2, `tauri-macros` 2.7.3, `muda` 0.20.0, `tray-icon` 0.25.1 and the
# plugins) declare `rust-version = "1.90"`, so the locked workspace cannot be
# resolved at 1.89 no matter what the source itself compiles at. The source
# needs 1.89: `ml/features.rs` builds `Some(&ModelCapabilities { .. })` inside a
# `let`, and temporary lifetime extension only reaches through a tuple-variant
# constructor from 1.89 (rust-lang/rust#140593), so the test targets do not
# compile at 1.88. The higher of the two is the declaration; a minimum the
# locked tree cannot meet is the same false advertisement this field was once
# corrected for. The `msrv` job in `.github/workflows/ci.yml` pins this version
# and checks the locked workspace, test targets included, so the declaration is
# enforced rather than advertised.
# Every member crate inherits this field through `rust-version.workspace = true`.
rust-version = "1.90"

[workspace.dependencies]
axum = { version = "0.8.7", features = ["json"] }
bytes = "1.10.1"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
futures-util = "0.3.31"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "process", "io-util"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
# Favour throughput over the last few hundred KB: this is a request proxy.
opt-level = 3
panic = "abort"
strip = true
