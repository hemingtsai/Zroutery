[workspace]
members = ["crates/zroutery-core", "crates/zroutery-headless", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
# The minimum is the union of two floors established from the tree itself, not a
# policy number. The locked dependencies need 1.88: `icu_normalizer` 2.3.0,
# `time` 0.3.55, `darling` 0.23.0, `image` 0.25.10 and `plist` 1.10.0 declare
# `rust-version = "1.88.0"`, so 1.80 could not resolve this `Cargo.lock` at all.
# The source needs 1.89: `ml/features.rs` builds `Some(&ModelCapabilities { .. })`
# inside a `let`, and temporary lifetime extension only reaches through a
# tuple-variant constructor from 1.89 (rust-lang/rust#140593), so the test
# targets do not compile at 1.88. The `msrv` job in
# `.github/workflows/ci.yml` pins this version and checks the locked workspace,
# test targets included, so the declaration is enforced rather than advertised.
# Every member crate inherits this field through `rust-version.workspace = true`.
rust-version = "1.89"

[workspace.dependencies]
axum = { version = "0.8.7", features = ["json"] }
bytes = "1.10.1"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
futures-util = "0.3.31"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
# Favour throughput over the last few hundred KB: this is a request proxy.
opt-level = 3
panic = "abort"
strip = true
