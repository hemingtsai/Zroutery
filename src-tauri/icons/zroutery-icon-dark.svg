<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Zroutery dark app icon</title>
  <desc>Minimal white geometric Z on a graphite gradient squircle.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B4A56"/>
      <stop offset="1" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="z" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFCFC"/>
      <stop offset="1" stop-color="#ECECEE"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="z-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#gloss)"/>

  <!-- Geometric Z -->
  <path
    d="M146 146 H366 L146 366 H366"
    fill="none"
    stroke="url(#z)"
    stroke-width="62"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#z-shadow)"/>
</svg>
