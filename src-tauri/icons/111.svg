<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Zroutery Routing-Z logo concept</title>
  <desc>Geometric Z-shaped routing mark with a central switch node.</desc>

  <!-- App icon background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#0F1115"/>

  <!-- Routing-Z -->
  <path
    d="M112 146
       H382
       L130 366
       H400"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Central routing/switch node -->
  <circle cx="256" cy="256" r="31" fill="#0F1115" stroke="#FFFFFF" stroke-width="16"/>
  <circle cx="256" cy="256" r="11" fill="#8B5CF6"/>

  <!-- Provider input nodes -->
  <circle cx="112" cy="146" r="19" fill="#FFFFFF"/>
  <circle cx="400" cy="366" r="19" fill="#FFFFFF"/>

  <!-- Small directional feeder lines -->
  <path d="M72 146 H112" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <path d="M400 366 H440" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
</svg>