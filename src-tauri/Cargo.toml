[package]
name = "zroutery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Aggregate several LLM providers behind one local Anthropic and OpenAI compatible endpoint"
default-run = "zroutery"

[[bin]]
name = "zroutery"
path = "src/main.rs"

[[bin]]
name = "zroutery-headless"
path = "src/bin/headless.rs"

[lib]
name = "zroutery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zroutery-core = { path = "../crates/zroutery-core" }

chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { workspace = true }

keyring = { version = "3.6.3", features = ["apple-native"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-clipboard-manager = "2"
