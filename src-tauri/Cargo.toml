[package]
name = "zroutery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Aggregate several LLM providers behind one local Anthropic and OpenAI compatible endpoint"
default-run = "zroutery"

[[bin]]
name = "zroutery"
path = "src/main.rs"

[lib]
name = "zroutery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# `ml` puts the learned model in the routing path: the durable trace log, the
# active-model store and the ML ranking of the provider plan.
#
# It is on by default and can still be turned off with `--no-default-features`,
# which restores exactly the pre-ADR-0006 behaviour: a desktop binary that
# contains no ML stack and routes deterministically. That is worth keeping as a
# build rather than deleting, because "ship without learning" is a legitimate
# choice for someone who does not want their routing history on disk.
default = ["ml"]
ml = ["zroutery-core/ml"]
# `account` carries the account subsystem: the per-provider account declarations
# in config and the runtime state probing derives from them.
#
# **Not in `default`**, on purpose and by record. `node-status/account.status.json`
# and `stage-5.status.json` both record "Account remains optional and is not
# enabled by the default Tauri dependency", and both add "without changing ML
# feature order". The two switches are declared independently upstream, so turning
# this one on does not perturb the learning build and leaving it off does not
# perturb this one.
#
# Note the wording above is deliberate. `activation_test` refuses any manifest line
# carrying both the core crate name and the word "features", because a dependency
# that names its own switches cannot be turned off without editing the manifest. A
# comment that merely *describes* those switches trips the same guard, and it is
# right to: the scanner cannot tell prose from configuration, and guessing which one
# it is would be worse than refusing.
#
# The surface is not reachable yet: nothing probes an account, so with this on the
# store is constructed and stays empty. That is the honest state, and it is why
# the GUI half of this is blocked rather than merely unwritten.
account = ["zroutery-core/account"]
# `newapi` adds the NewAPI panel adapter, which brings the account subsystem with
# it. Still not in `default`: enabling a feature for `zroutery-core` is declared
# upstream, so this does not touch the `ml` switch or its position.
newapi = ["zroutery-core/newapi"]
# `account-maint` adds the browser-driven check-in surface: an isolated headed
# browser per account, a pause the user can resume, and the Tauri commands that
# start, resume, cancel and report one.
#
# Kept separate from `account` rather than folded into it, because a half of this
# needs to exist without a browser: an account can be declared, probed and
# reported on with no check-in at all, and a build that forced the browser stack
# into that path would make the cheaper thing the expensive one.
account-maint = ["newapi"]

[dependencies]
zroutery-core = { path = "../crates/zroutery-core" }

chrono = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { workspace = true }

# Driving the user's own Chromium browser over the DevTools protocol. TLS is
# deliberately off: the debugging endpoint is on loopback, so the features that
# would pull a TLS stack and a root store in have nothing to authenticate.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "handshake",
    "connect",
    "url",
] }

# Reading CC Switch's provider database; bundled so no system SQLite is needed.
rusqlite = { version = "0.40", features = ["bundled"] }

tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"

# Each platform uses its native credential store: the macOS keychain or the
# Windows Credential Manager. Both backends exist in the same keyring version
# under target-specific features.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# Reading the user's UI language for the tray menu, which is drawn before any
# webview (and its locale machinery) exists.
windows-sys = { version = "0.60", features = ["Win32_Globalization"] }
