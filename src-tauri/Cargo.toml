[package]
name = "zroutery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Aggregate several LLM providers behind one local Anthropic and OpenAI compatible endpoint"
default-run = "zroutery"

[[bin]]
name = "zroutery"
path = "src/main.rs"

[lib]
name = "zroutery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The shipped desktop app carries every capability its own interface offers.
#
# That sentence is the whole argument, and it is the same argument ADR-0006 made
# about the learning stack: a build that compiles an interface which offers a
# capability it does not contain is a build that tells the operator the thing
# works and then does not do it. The dashboard's account page, its check-in and
# its two OpenCode provider kinds were all offered unconditionally while the
# features behind them were off — so the panel said "this build contains no
# account subsystem" to the very people the product was written for, and the
# balance a user asked for was in the source tree and in no installation of it.
#
# **Every one of these is inert until the operator asks for it.** Nothing probes
# an account until an account is declared; nothing asks a panel until an account
# exists and the button is pressed; no browser opens until the operator starts a
# check-in; the OpenCode providers only answer when one is configured. So the
# capability is in the binary and the behaviour is not in it — which is exactly
# the shape ADR-0006 settled on for the learning stack, where
# `ml_routing.enabled` still defaults to off and an installation that has never
# promoted a model routes as it did before.
#
# The reason these were once kept out is recorded and has expired. It was
# "the surface is not reachable yet: nothing probes an account, so with this on
# the store is constructed and stays empty". The reconciler landed, every
# declared account is now probed and published, and the reason for the exclusion
# no longer describes the code. The reason that replaced it — that a capability
# behind a flag is a capability no operator meets — is the one this change
# answers.
#
# `--no-default-features` still builds a desktop app with none of it, which is
# worth keeping as a build rather than deleting: "ship without a learning stack"
# and "ship without an account subsystem" are legitimate choices for someone who
# does not want their routing history or their panel credentials on disk.
#
# Note the wording below is deliberate. `activation_test` refuses any manifest
# line carrying both the core crate name and the word "features", because a
# dependency that names its own switches cannot be turned off without editing
# the manifest. A comment that merely *describes* those switches trips the same
# guard, and it is right to: the scanner cannot tell prose from configuration,
# and guessing which one it is would be worse than refusing. So the switches are
# declared here and only here, and the dependency line below stays clean.
default = ["ml", "account", "newapi", "account-maint", "opencode"]
# `ml` puts the learned model in the routing path: the durable trace log, the
# active-model store and the ML ranking of the provider plan.
ml = ["zroutery-core/ml"]
# `account` carries the account subsystem: the per-provider account declarations
# in config and the runtime state probing derives from them.
account = ["zroutery-core/account"]
# `newapi` adds the NewAPI panel adapter, which brings the account subsystem with
# it. The panel is where a NewAPI relay's wallet lives, so this is what makes a
# panel-backed balance reachable at all: the relay publishes no balance of its
# own, and the figure is the sum of what the provider's accounts report.
newapi = ["zroutery-core/newapi"]
# `opencode` adds the OpenCode Zen gateway providers: the anonymous free tier
# and the Console OAuth tier, plus its `/api/config` model discovery. The
# request shaping that makes OpenCode's gateway accept a request lives here
# too, and the gateway checks a fixed fingerprint — so without this the two
# kinds are configuration that every request is refused by.
opencode = ["zroutery-core/opencode"]
# `account-maint` adds the browser-driven check-in surface: an isolated headed
# browser per account, a pause the user can resume, and the Tauri commands that
# start, resume, cancel and report one.
#
# Kept separate from `account` rather than folded into it, because a half of this
# needs to exist without a browser: an account can be declared, probed and
# reported on with no check-in at all, and a build that forced the browser stack
# into that path would make the cheaper thing the expensive one.
account-maint = ["newapi"]

[dependencies]
zroutery-core = { path = "../crates/zroutery-core" }
chrono = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { workspace = true }
# Parsing panel addresses for browser check-in: the relay endpoint carries a
# `/v1` path, while the panel's own paths are relative to its origin.
url = "2"

# Driving the user's own Chromium browser over the DevTools protocol. TLS is
# deliberately off: the debugging endpoint is on loopback, so the features that
# would pull a TLS stack and a root store in have nothing to authenticate.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "handshake",
    "connect",
    "url",
] }

# Reading CC Switch's provider database; bundled so no system SQLite is needed.
rusqlite = { version = "0.40", features = ["bundled"] }

tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"

# The desktop-native shell: one process at a time, a way to summon the
# window from another application, a `zroutery://` URL scheme, and a
# notification for a failure the operator cannot see on screen.
#
# Unconditional on purpose: the feature table above is the product's own
# switchboard, and a desktop shell that changes shape with the ML stack
# would make the packaged binary depend on a learning flag.
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"

# Each platform uses its native credential store: the macOS keychain or the
# Windows Credential Manager. Both backends exist in the same keyring version
# under target-specific features.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# Reading the user's UI language for the tray menu, which is drawn before any
# webview (and its locale machinery) exists.
windows-sys = { version = "0.60", features = ["Win32_Globalization"] }

# A panel on a real socket, for the balance path.
#
# Dev-only, and deliberately not the core crate's own mock: that one is inside
# the adapter's test module and cannot be reached from here. The desktop's
# suite has to stand up its own panel, because the path it drives is the
# desktop's — the provider's configuration, the secret store, the reconciler,
# the store and the sum — and the adapter is only one link of it.
[dev-dependencies]
axum = { workspace = true }
