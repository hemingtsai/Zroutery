name: ci

on:
  push:
    # `dev` is where the work actually lands. Watching only `main` is how a
    # build command broken by the package split survived fourteen commits
    # unnoticed, because `main` never saw the split.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Advisories have their own clock. `cargo audit` and `pnpm audit` answer a
  # question about the world at the moment they run, not a question about the
  # commit: a tree that was clean when it landed becomes a finding when a CVE is
  # published, and not one line in this repository changes when that happens. A
  # push-and-PR-only workflow can therefore never report it.
  #
  # The schedule runs the whole workflow, not only the `audit` job below. That
  # is deliberate rather than incidental: the `msrv` job pins a compiler and the
  # `reachability` job builds the shipped binary, and both are exactly the kind
  # of claim that rots silently between pushes. The nightly run is where that
  # rot is found rather than discovered by a release.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# The commit-message convention has its own workflow; this one is about the
# code: lint and test the GUI-free core on Linux, check the declared minimum
# toolchain against the locked tree, validate the repository's own records, test
# and smoke the whole workspace on the platform the desktop shell ships for, and
# gate the shipped Windows binary on what it may not name.
env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p zroutery-core --all-features -- -D warnings
      # Node TEST-FORMAT. This was red from the audit onward and was in no
      # pipeline, so it was red without anyone acting on it. It is a fast,
      # deterministic check with no reason to be expensive, so it runs on
      # every push rather than on a schedule.
      - name: Formatting
        run: cargo fmt --all -- --check
      # Every test step goes through scripts/test_gate.py. It runs the command
      # unchanged and exits with the command's own exit code, so it alters
      # nothing about what is gated; what it adds is that a failure is reported
      # BY NAME. This project lost the name of a failing test four times to ad-hoc
      # shell capture patterns, and each loss turned a real observation into an
      # unreproducible rumour that cost another audit cycle.
      - name: Tests
        run: python3 -B scripts/test_gate.py --quiet -- cargo test -p zroutery-core --all-features

  # The declared `rust-version` used to be a sentence nothing checked: every job
  # followed the floating `stable` channel, so the workspace's stated minimum
  # could sit below what the tree actually needs without any job changing
  # colour. It did. This job exists so it cannot again. The locked dependencies
  # need 1.90 (the desktop shell's Tauri 2.12.4 family, `muda` 0.20.0 and
  # `tray-icon` 0.25.1 declare it) and the source needs 1.89 (temporary lifetime
  # extension through a tuple-variant constructor), so the declaration is the
  # higher of the two. This job pins the declared minimum and builds the locked
  # tree with it, test targets included.
  msrv:
    name: declared minimum toolchain
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the declared minimum, not to `stable`. When Cargo.toml's
      # rust-version moves, this line moves with it in the same commit.
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: The pinned compiler is the declared minimum
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          installed="$(rustc --version | cut -d' ' -f2)"
          echo "declared rust-version=$declared, installed rustc=$installed"
          case "$installed" in
            "$declared"|"$declared".*) ;;
            *)
              echo "::error title=msrv::installed rustc $installed does not satisfy the declared rust-version $declared"
              exit 1
              ;;
          esac
      # `--locked` is the point: the minimum has to satisfy the dependency tree
      # the repository ships, not the one a resolver would pick today.
      # `--all-targets` is the other half: the declaration covers every target
      # the repository ships, so a check that skipped test targets would not
      # prove it.
      - name: Check the locked workspace at the declared minimum
        run: cargo check --workspace --locked --all-targets

  contracts:
    name: commit contract and orchestration docs
    runs-on: ubuntu-latest
    steps:
      # Full history: the commit contract is a range check and cannot see the
      # base revision in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cheap, and it is what stops a validator from rotting into a rubber
      # stamp: these prove each one still rejects what it is supposed to.
      - name: Validator self-tests
        run: |
          set -euo pipefail
          python3 scripts/commit_contract_test.py --self-test
          python3 scripts/orch_docs_test.py --self-test
          # The mutation gate is the one validator here that is not wired to any
          # pipeline, because a mutation is chosen per task rather than per run.
          # What CI can do is refuse to let the tool rot into a rubber stamp, which
          # is the same argument as the two above: a gate that can no longer reject
          # is worse than no gate, because it is trusted.
          #
          # Its self-test also answers "could this tool see a failure?" — a
          # harness that cannot distinguish caught from missed reports confidence
          # it never measured, which is how this project's failing test names were
          # lost five times.
          python3 -B scripts/mutation_gate.py --self-test
          # Same argument again, for the feature matrix: the thing that proves this
          # tool is not a rubber stamp is that it can still go red. The self-test
          # asserts a failing combination becomes a non-zero exit and that a stale
          # exemption ratchets rather than passing quietly.
          python3 -B scripts/feature_matrix_gate.py --self-test

      - name: Commit contract over the change range
        env:
          # Derived from the event, never hardcoded. On a pull request this is
          # the base tip the PR was opened against; on a push it is the
          # revision the branch sat at beforehand. `||` falls through to the
          # push field because `github.event.pull_request` is null on a push.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A branch's first push reports an all-zero `before`: there is no
          # prior revision and so no range to check. Say that and pass. Feeding
          # the zeros to git instead is exactly the spurious failure this avoids
          # -- the validator exits 1 on an unresolvable range.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice title=commit contract::no prior revision in this event (first push of the branch); no change range to validate"
            exit 0
          fi
          # With fetch-depth: 0 the base is present. If it is not, the checkout
          # is wrong, and exiting 0 here would report a pass nobody earned.
          if ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            echo "::error title=commit contract::base $BASE_SHA is absent from this checkout; refusing to report a pass we did not earn"
            exit 1
          fi
          echo "validating every non-merge commit in ${BASE_SHA}..HEAD"
          python3 scripts/commit_contract_test.py --base "$BASE_SHA" --head HEAD

      - name: Orchestration docs, DAG and evidence registry
        run: |
          set -euo pipefail
          python3 scripts/orch_docs_test.py

      # Every command the dashboard calls, against every command the backend
      # registers.
      #
      # A control the interface offers and the backend cannot serve is the same
      # defect as a provider kind a build cannot use: the operator is told the
      # thing works, and it does not. The OpenCode provider kinds were found by
      # reading, and the four undocumented feature-gated calls by running this;
      # it is here so the next one is found by running it.
      #
      # The self-test answers "could this tool see a failure?" — a harness that
      # cannot distinguish caught from missed reports confidence it never
      # measured, which is how this project's failing test names were lost five
      # times.
      - name: The interface calls only commands the backend registers
        run: |
          set -euo pipefail
          python3 -B scripts/command_surface_test.py --self-test
          python3 -B scripts/command_surface_test.py

  desktop:
    name: workspace tests and end-to-end smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace
      # Every feature combination, not the one this step already chose.
      #
      # This job's other steps all build with features *on*: `--workspace` resolves
      # the headless proxy's unconditional `ml`, the test steps run whole-workspace,
      # and the reachability job builds the shipped binary. So a defect that exists
      # only when a feature is **off** cannot change any of them, and the project
      # has shipped that defect twice: E-115 records a test file naming
      # `zroutery_core::account::{...}` with no crate-level
      # `#![cfg(feature = "account")]`, and the account maintenance work later
      # gated `panel_adapter` and `panel_root` on `account-maint` while their
      # caller was gated on `newapi`, so `--features newapi` alone did not compile.
      # Both times every gate run was green, because every gate was feature-enabled.
      #
      # The matrix is derived from each manifest rather than written down, so a
      # feature added next month is covered the day it is added instead of on the
      # day someone remembers this file.
      #
      # It lives here rather than in `core` for the same reason `cargo check
      # --workspace` does: the desktop package needs this platform's frameworks,
      # and the matrix walks its combinations. `--package zroutery-core` covers the
      # core matrix without them.
      - name: Every feature combination builds
        run: python3 -B scripts/feature_matrix_gate.py
      # The project's own mandatory gate, run as exactly the command
      # package.json declares. It lives here and not in `core` because
      # `--workspace` includes the Tauri package, which needs this platform's
      # system frameworks; `core` is deliberately GUI-free so that linting the
      # core never depends on them.
      # `cargo test --workspace` is NOT a default-features run any more, and a
      # step called "default features" that quietly enables ml is worse than no
      # step at all: it claims coverage it does not provide. The headless proxy
      # package depends on zroutery-core with `features = ["ml"]` unconditionally,
      # so merely being in the workspace graph turns ml on for the whole
      # resolution. Measured: `cargo test --workspace` runs 1733 tests including
      # all 22 of the ml-gated statistics suite, while excluding that one package
      # runs 999 and compiles that suite to zero.
      #
      # So the default-features gate excludes it, and the ml-enabled run is the
      # whole-workspace one. Those are the two distinct things worth asserting,
      # and naming either of them the other would be a lie in a build log.
      - name: Tests (default features, ml package excluded)
        run: python3 -B scripts/test_gate.py --quiet -- cargo test --workspace --exclude zroutery-headless
      - name: Tests (whole workspace, ml enabled by the headless package)
        run: python3 -B scripts/test_gate.py --quiet -- cargo test --workspace
      # The headless proxy is its own package now, and that package's bin target
      # is the only thing named zroutery-headless. The old
      # `-p zroutery --bin zroutery-headless` asks the desktop package for a
      # target it no longer has and fails outright. This is the same build
      # package.json's `smoke` script runs, and it writes the exact path
      # smoke_test.py looks for by default: target/debug/zroutery-headless.
      - name: Build the headless binary
        run: cargo build -p zroutery-headless
      # The smoke suite starts a mock upstream and the real binary, so it needs
      # the platform the desktop shell ships for; it is the only job that
      # exercises the proxy end to end, which is why it lives here.
      - name: End-to-end smoke
        run: python3 -B scripts/test_gate.py --quiet -- python3 scripts/smoke_test.py

  reachability:
    name: shipped desktop binary reachability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # windows-latest does not guarantee a `python3` on PATH, and the validators
      # are stdlib-only, so pin an interpreter instead of assuming one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The desktop binary embeds the built frontend and tauri.conf.json points
      # frontendDist at ../ui/dist, which is gitignored. Build it so the gate
      # reads the binary that actually ships, not one built without assets.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Frontend unit tests
        run: pnpm --dir ui test
      - run: pnpm ui:build
      - name: Frontend size budget
        run: python -B scripts/ui_budget_test.py --report dist-size.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-size
          path: dist-size.txt
      - name: Narrow-window UI overflow gate
        run: python -B scripts/ui_overflow_test.py
      # Deliberately no build cache in this job, so the binary under test is the
      # one this job produced.
      - name: Build the shipped desktop binary
        # Tauri enables custom-protocol: a plain cargo --release build still
        # loads devUrl and therefore does not certify a self-contained UI.
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle
      # RETIRED by ADR-0006, and its subject then changed underneath it. This step
      # used to fail the job if the shipped desktop executable contained any ML
      # symbol, on the reasoning that a binary cannot route on a model it does not
      # contain -- true, and a statement about packaging rather than safety. The
      # prohibition it enforced is what kept the ML closed loop out of production.
      #
      # ADR-0006 replaced the prohibition with a gate, a deterministic fallback
      # and a rollback, and this job now builds the learning stack into the
      # desktop app on purpose. The scanner's premise is therefore inverted: the
      # binary is *supposed* to contain it now, and a byte scan would be asserting
      # the opposite of the truth.
      #
      # What replaced it is the pair of steps below, because both are claims that
      # can actually fail rather than claims about symbol names:
      #   - `ml_closed_loop_test` in the core job asserts that a promoted model is
      #     served, observed and rolled back, in a live process, with the rollback
      #     verified to reach the router rather than only the pointer;
      #   - the escape-hatch build here asserts that "ship without learning" is
      #     still a build someone can choose, which is a promise the manifest makes
      #     and nothing else keeps honest.
      - name: Build the desktop app without the learning stack
        run: cargo check -p zroutery --no-default-features

  # Supply-chain advisories, on two cadences.
  #
  # On a pull request this job reports and does not block. An advisory published
  # last night is not the author's defect, and a red check on an unrelated pull
  # request teaches people to ignore the job — which is the failure mode a
  # blocking audit has in every project that has ever had one. The nightly run
  # above is the one that is allowed to be red, because that is the run whose
  # failure somebody can act on.
  #
  # `cargo audit` is not a grep over `Cargo.toml`: it reads `Cargo.lock` and
  # checks it against the RustSec advisory database, which is the only list that
  # knows a transitive dependency is affected. It is installed here rather than
  # assumed, and only when the runner does not already have it, so a future
  # image that ships it costs nothing.
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    # Expressions are allowed here, and the expression is the whole policy: warn
    # on a pull request, fail on the schedule.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit when the runner has none
        run: |
          set -euo pipefail
          if command -v cargo-audit >/dev/null 2>&1; then
            cargo audit --version
          else
            cargo install cargo-audit --locked
          fi
      # `--deny warnings` would be the wrong default here: a yanked crate or an
      # unmaintained advisory is information, and this job's job is to surface
      # the information rather than to decide which part of it matters.
      #
      # `cargo audit` reads `Cargo.lock`, so it needs the lockfile rather than
      # a resolver run: the tree this repository ships is the tree that has to
      # be free of advisories.
      - name: Rust advisories against the locked tree
        run: cargo audit --file Cargo.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend advisories against the lockfile
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          # `--prod` on purpose: a build-tool advisory is worth knowing about and
          # is not shipped, and mixing the two makes the shipped surface
          # unreadable.
          #
          # The registry is named explicitly because `pnpm audit` asks the
          # registry for the advisory endpoint, and a mirror that does not
          # implement it answers "the endpoint does not exist" — which looks
          # like a finding and is not one. Naming the canonical registry makes
          # the answer the same everywhere, and the mirror is still what the
          # install above uses.
          pnpm audit --prod --registry=https://registry.npmjs.org
