name: commit-lint

on:
  pull_request:
    branches: [main]

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          fail=0
          for sha in $(git rev-list "$BASE_SHA..HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%B "$sha")

            if ! printf '%s' "$subject" | grep -qE '^(feat|fix|refactor|test|perf|docs|build|ci|chore)\((core|router|protocol|policy|runtime|ml|account|provider|integration|tauri|workflow|repo)\): [a-z].{0,70}$'; then
              echo "::error title=commit $sha::subject does not match <type>(<scope>): <summary> — got: $subject"
              fail=1
            fi

            if printf '%s' "$body" | grep -qiE '\bStage[[:space:]]*[0-9]|\[WORKFLOW\]|Gate[[:space:]]+[[:alnum:]_]+[[:space:]]*[—-][[:space:]]*PASS|^Roadmap:|^Next Stage:|^Tests:[[:space:]]*[0-9]|^Risks:|^Scope:|^Implementation:'; then
              echo "::error title=commit $sha::message contains forbidden roadmap/gate content"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "commit-lint: FAILED"
            exit 1
          fi
          echo "commit-lint: all commits valid"
